<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <style type="text/css">
        .shooter {
            width: 80px; 
            position: absolute;     
        }
        .box {
            background-image: url(game.png);
            height: 1000px; 
            background-size: 100% 100%;
        }
        .zombies {
            width: 80px; 
            position: absolute;
        }
        .color {
            color: white;
        }
    </style>
</head>
<body>  
    
    <div class="box" style="">
<h5 style="position: absolute; left: 100px; top: 50px" class="score color">счёт: 0</h5>

<img class="shooter" src="peashooter.png" style="top: 250px; left: 600px;">
<img class="shooter" src="peashooter.png" style="top: 350px; left: 600px;">
<img class="shooter" src="peashooter.png" style="top: 450px; left: 600px;">
<img class="shooter" src="peashooter.png" style="top: 550px; left: 600px;">
<img class="shooter" src="peashooter.png" style="top: 650px; left: 600px;">
<img class="shooter" src="peashooter.png" style="top: 770px; left: 600px;">
<!--ЗОМБИ-->
<img class="zombies" src="zombie1.png" style="top: 220px; left: 1500px;">
<img class="zombies" src="zombie2.png" style="top: 320px; left: 1500px;">
<img class="zombies" src="zombie2.png" style="top: 420px; left: 1500px;">
<img class="zombies" src="zombie4.png" style="top: 520px; left: 1500px;">
<img class="zombies" src="zombie4.png" style="top: 620px; left: 1500px;">
<img class="zombies" src="zombie1.png" style="top: 740px; left: 1500px;">
</div>
<script>
let shooters = document.querySelectorAll(".shooter");
let zombies = document.querySelectorAll(".zombies");
let scoreDisplay = document.querySelector(".score");

let zombiePositions = [1500, 1500, 1500, 1500, 1500, 1500];
let eatenCount = 0;
let points = 0;

zombies.forEach((zombie, index) => {
    zombie.onclick = function() {
        
        zombiePositions[index] -= 100;
        zombie.style.left = zombiePositions[index] + "px";

        if (zombiePositions[index] === 600) {
            alert(`Зомби на линии ${index + 1} съел горохострел!`);
            shooters[index].style.display = "none";
            eatenCount++;
            
            points += 10;
            scoreDisplay.innerHTML = "счёт: " + points;

            checkGameOver();
        }   
    }
});

function checkGameOver() {
    if (eatenCount === 6) {
        alert("Зомби съели все горохострелы! Конец игры.");
        zombies.forEach(zombie => {
            zombie.style.display = "none";
        });
    }
}
</script>
</body>
</html>
